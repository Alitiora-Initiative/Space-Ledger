<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="16" fill="#1a1a2a"/>
  <!-- Fox head body -->
  <polygon points="36,52 64,24 92,52 92,72 64,82 36,72" fill="#e4761b"/>
  <!-- Left ear -->
  <polygon points="24,28 36,52 48,28" fill="#e2761b"/>
  <!-- Right ear -->
  <polygon points="80,28 92,52 104,28" fill="#e2761b"/>
  <!-- Ear inner left -->
  <polygon points="28,34 36,50 46,34" fill="#d7c1b3"/>
  <!-- Ear inner right -->
  <polygon points="82,34 92,50 100,34" fill="#d7c1b3"/>
  <!-- Snout -->
  <polygon points="52,68 64,76 76,68 76,84 64,90 52,84" fill="#d7c1b3"/>
  <!-- Nose -->
  <circle cx="64" cy="76" r="3" fill="#763d16"/>
  <!-- Left eye -->
  <circle cx="50" cy="60" r="5" fill="#763d16"/>
  <!-- Right eye -->
  <circle cx="78" cy="60" r="5" fill="#763d16"/>
  <!-- Eye shine left -->
  <circle cx="52" cy="58" r="2" fill="white"/>
  <!-- Eye shine right -->
  <circle cx="80" cy="58" r="2" fill="white"/>
</svg>
