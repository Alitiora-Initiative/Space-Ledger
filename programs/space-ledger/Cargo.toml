[package]
name = "space-ledger-program"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "space_ledger_program"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1", features = ["token"] }
pyth-solana-receiver-sdk = "2.0.0"
