name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - programs/space-ledger/Cargo.toml
          - rust/bonding_curve_validator/Cargo.toml
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --manifest-path "${{ matrix.manifest }}"
    - name: Run tests
      run: cargo test --verbose --manifest-path "${{ matrix.manifest }}"
